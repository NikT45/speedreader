<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speed Reader</title>
<style>
  :root {
    --bg: #111; --fg: #eee; --muted: #888; --accent: #e5484d; --panel: #1b1b1b; --border: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--fg); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  }
  textarea {
    width: min(720px, 100%); height: 160px; resize: vertical;
    background: var(--panel); color: var(--fg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px; font: 15px/1.5 inherit; outline: none;
  }
  textarea:focus { border-color: #555; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
    margin: 16px 0; width: min(720px, 100%);
  }
  button {
    background: #2b2b2b; color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 16px; font-size: 14px; cursor: pointer;
  }
  button:hover { background: #363636; }
  button.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  label { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 160px; }
  .stage {
    width: min(720px, 100%); height: 200px; position: relative;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .stage::before, .stage::after {
    content: ""; position: absolute; left: 50%; width: 1px; height: 28px; background: #444;
  }
  .stage::before { top: 0; }
  .stage::after { bottom: 0; }
  .word {
    font-family: Georgia, "Times New Roman", serif; font-size: 48px; white-space: pre;
    position: absolute; left: 50%; display: flex;
  }
  .word .l { text-align: right; }
  .word .orp { color: var(--accent); }
  .word .l, .word .r { flex: none; }
  .progress { width: min(720px, 100%); height: 4px; background: var(--border); border-radius: 2px; margin-top: 12px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--fg); transition: width .1s linear; }
  .status { color: var(--muted); font-size: 13px; margin-top: 8px; display: flex; gap: 16px; }
  .hint { color: #555; font-size: 12px; margin-top: 24px; text-align: center; }
  .credit { color: #555; font-size: 12px; margin-top: 8px; }
  .credit a { color: var(--muted); text-decoration: none; }
  .credit a:hover { color: var(--fg); }
  kbd { background: #222; border: 1px solid #333; border-radius: 4px; padding: 1px 5px; font-family: inherit; }
</style>
</head>
<body>
<textarea id="text" placeholder="Paste your text here…"></textarea>

<div class="controls">
  <button id="play" class="primary">Start</button>
  <button id="back">◀ 10</button>
  <button id="fwd">10 ▶</button>
  <button id="reset">Reset</button>
  <label><input type="range" id="wpm" min="100" max="1000" step="25" value="300"> <span id="wpmVal">300</span> wpm</label>
</div>

<div class="stage">
  <div class="word" id="word"><span class="l"></span><span class="orp"></span><span class="r"></span></div>
</div>
<div class="progress"><div id="bar"></div></div>
<div class="status"><span id="pos">0 / 0</span><span id="eta"></span></div>
<p class="hint"><kbd>Space</kbd> play/pause · <kbd>←</kbd>/<kbd>→</kbd> skip · <kbd>↑</kbd>/<kbd>↓</kbd> speed · <kbd>R</kbd> reset</p>
<p class="credit">made by <a href="https://x.com/niktanner" target="_blank" rel="noopener">@niktanner</a></p>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const textEl = $('text'), playBtn = $('play'), wpmEl = $('wpm'), wpmVal = $('wpmVal');
  const wordEl = $('word'), L = wordEl.children[0], O = wordEl.children[1], R = wordEl.children[2];
  const bar = $('bar'), pos = $('pos'), eta = $('eta');

  let words = [], i = 0, playing = false, timer = null;

  // Load saved state
  try {
    const saved = JSON.parse(localStorage.getItem('speedreader') || '{}');
    if (saved.text) textEl.value = saved.text;
    if (saved.wpm) wpmEl.value = saved.wpm;
    if (saved.i) i = saved.i;
  } catch {}
  wpmVal.textContent = wpmEl.value;

  function save() {
    try { localStorage.setItem('speedreader', JSON.stringify({ text: textEl.value, wpm: wpmEl.value, i })); } catch {}
  }

  function tokenize() {
    words = textEl.value.trim().split(/\s+/).filter(Boolean);
    if (i >= words.length) i = 0;
  }

  // Optimal recognition point: slightly left of center, like Spritz.
  function orpIndex(w) {
    const n = w.replace(/[^\p{L}\p{N}]/gu, '').length || w.length;
    if (n <= 1) return 0;
    if (n <= 5) return 1;
    if (n <= 9) return 2;
    if (n <= 13) return 3;
    return 4;
  }

  function show() {
    if (!words.length) { L.textContent = O.textContent = R.textContent = ''; pos.textContent = '0 / 0'; eta.textContent = ''; bar.style.width = '0'; return; }
    const w = words[i];
    const k = Math.min(orpIndex(w), w.length - 1);
    L.textContent = w.slice(0, k);
    O.textContent = w[k];
    R.textContent = w.slice(k + 1);
    // Center the ORP letter on the stage midline.
    const orpHalf = O.offsetWidth / 2;
    wordEl.style.transform = `translateX(-${L.offsetWidth + orpHalf}px)`;
    pos.textContent = `${i + 1} / ${words.length}`;
    bar.style.width = `${((i + 1) / words.length) * 100}%`;
    const secs = Math.round((words.length - i - 1) * 60 / +wpmEl.value);
    eta.textContent = secs > 0 ? `~${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} left` : '';
  }

  // Longer words and sentence ends get a bit more time.
  function delayFor(w) {
    const base = 60000 / +wpmEl.value;
    let m = 1;
    if (w.length > 8) m += 0.3;
    if (w.length > 12) m += 0.3;
    if (/[.!?]["')\]]*$/.test(w)) m += 1.2;
    else if (/[,;:]["')\]]*$/.test(w)) m += 0.5;
    if (/^\d+$/.test(w)) m += 0.3;
    return base * m;
  }

  function tick() {
    if (!playing) return;
    if (i >= words.length - 1) { show(); stop(); i = words.length; save(); return; }
    i++;
    show(); save();
    timer = setTimeout(tick, delayFor(words[i]));
  }

  function start() {
    tokenize();
    if (!words.length) { textEl.focus(); return; }
    if (i >= words.length) i = 0;
    playing = true;
    playBtn.textContent = 'Pause';
    show();
    timer = setTimeout(tick, delayFor(words[i]));
  }
  function stop() {
    playing = false;
    clearTimeout(timer);
    playBtn.textContent = i >= words.length - 1 && words.length ? 'Restart' : 'Start';
  }
  function toggle() { playing ? stop() : start(); }
  function skip(n) { tokenize(); i = Math.max(0, Math.min(words.length - 1, i + n)); show(); save(); if (playing) { clearTimeout(timer); timer = setTimeout(tick, delayFor(words[i])); } }
  function reset() { stop(); i = 0; tokenize(); show(); save(); playBtn.textContent = 'Start'; }
  function setWpm(v) { wpmEl.value = Math.max(100, Math.min(1000, v)); wpmVal.textContent = wpmEl.value; save(); show(); }

  playBtn.onclick = toggle;
  $('back').onclick = () => skip(-10);
  $('fwd').onclick = () => skip(10);
  $('reset').onclick = reset;
  wpmEl.oninput = () => setWpm(+wpmEl.value);
  textEl.oninput = () => { stop(); i = 0; tokenize(); show(); save(); };

  document.addEventListener('keydown', e => {
    if (e.target === textEl || e.target.tagName === 'INPUT') return;
    switch (e.key) {
      case ' ': e.preventDefault(); toggle(); break;
      case 'ArrowLeft': skip(-10); break;
      case 'ArrowRight': skip(10); break;
      case 'ArrowUp': setWpm(+wpmEl.value + 25); break;
      case 'ArrowDown': setWpm(+wpmEl.value - 25); break;
      case 'r': case 'R': reset(); break;
    }
  });

  tokenize(); show();
})();
</script>
</body>
</html>
